<html>
    <head>
        <title>quiz game</title>
     <style>
        body {
            background-color: #d5d5d5;
        }

        .quiz-container {
            box-sizing: border-box;
            width: 50%;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            background-color: white;
           border-radius: 20px;
            box-shadow: 0 3px 2px rgba(143, 21, 114, 0.1);
        }

        .choices {
            display: grid;
        }

        .choice {
            font-size: 1em;
            display: inline-block;
            margin: 5px 5px;
            padding: .5em .75em;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #next {
            float: right;
            display: none; 
        }

        #submit {
            float: left;
            display: none; 
        }

        #start {
            display: block; 
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 1.2em;
        }

        .choice:hover {
            background-color: rgb(78, 81, 83);
        }
        .choice.selected {
      background-color:rgb(12, 12, 12);
      border: 2px solid #007bff;
    }

    #feedback {
      margin-top: 10px;
      font-weight: bold;
    }

   
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Quiz game</h1>
        <button id="start" onclick="showQuestion()">Start Quiz</button>
        <div class="question" style="display: none;">
            <p id="question-text"></p>
            <div class="choices">
                <button class="choice" onclick="checkAnswer(0)"></button>
                <button class="choice" onclick="checkAnswer(1)"></button>
                <button class="choice" onclick="checkAnswer(2)"></button>
            </div>
            <p id="feedback"></p>
        </div>
        <button id="submit" onclick="checkAnswer()"> Submit</button>
        <button id="next" onclick="nextQuestion()">Next</button>
        <div id="result" style="display: none;"></div>

    </div>

  <script src="quiz.js"></script>
  </body>
  </html>
